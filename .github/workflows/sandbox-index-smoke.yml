name: Sandbox Index smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modal-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install AgentEnv and the plugin
        run: python -m pip install 'agentenv-framework==0.9.1564' .
      - name: Run startup and reliability samples
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          : "${MODAL_TOKEN_ID:?Set secret MODAL_TOKEN_ID before dispatching}"
          : "${MODAL_TOKEN_SECRET:?Set secret MODAL_TOKEN_SECRET before dispatching}"
          agent-env bench sandboxes --providers modal_vm --metrics S1,R1 --samples 20 --out runs/modal_vm
      - name: Score the samples
        run: agent-env bench score runs/modal_vm --json > runs/modal_vm/score.json
      - name: Upload benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: modal-vm-smoke
          path: runs/modal_vm/
          if-no-files-found: ignore
